name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The app only builds on macOS (AppKit/SwiftUI), and CodeQL's autobuild can't handle build.sh.
    # CodeQL traces Swift only through `swift build`/`xcodebuild`, hence Package.swift.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            # CodeQL's tracer makes `uname -m` report x86_64 on arm64 runners; match Homebrew's arm64 FFmpeg.
            build: ARCHS=arm64 ./build.sh
          - language: swift
            build: swift build --arch arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install FFmpeg
        run: brew install ffmpeg

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build
        run: ${{ matrix.build }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
